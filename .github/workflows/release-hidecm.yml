name: Build HideCM (standalone)

permissions: write-all

concurrency:
  group: build-hidecm-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: ['1.5.0-hidecm']

jobs:
  build-all:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      # Use an immutable source-specific tag so a release never points to stale code.
      upload-tag: "custom-hidecm-${{ github.sha }}"
